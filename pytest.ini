[pytest]
# Capture output at the sys level, not by swapping file descriptors 1 and 2:
# with fd capture, Tcl/Tk intermittently fails to read its own library files
# (measured 2026-09-19 on the toast tests: 8 failures in 6 runs with
# --capture=fd, none with --capture=sys or --capture=no).
addopts = --capture=sys
